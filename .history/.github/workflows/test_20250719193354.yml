on: [push, pull_request]
name: Test
jobs:
  unit-test:
    runs-on: ubuntu-22.04
    steps:
    - name: Install Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24.x
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Test
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: |
        timestamp=$(date +%Y%m%d%H%M%S)
        output_file="unit-test-${timestamp}.log"
        error_file="unit-test-${timestamp}-errors.log"
        make actions-test > $output_file 2> >(tee -a $output_file >&2 | tee $error_file >&2)
        bash <(curl -s https://codecov.io/bash) -t $CODECOV_TOKEN
  race-unit-test:
    runs-on: ubuntu-22.04
    steps:
    - name: Install Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24.x
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Test
      run: |
        timestamp=$(date +%Y%m%d%H%M%S)
        output_file="race-unit-test-${timestamp}.log"
        error_file="race-unit-test-${timestamp}-errors.log"
        RACE=1 make test > $output_file 2> >(tee -a $output_file >&2 | tee $error_file >&2)
  memfs-unit-test:
    runs-on: ubuntu-22.04
    steps:
    - name: Install Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24.x
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Test
      run: |
        timestamp=$(date +%Y%m%d%H%M%S)
        output_file="memfs-unit-test-${timestamp}.log"
        error_file="memfs-unit-test-${timestamp}-errors.log"
        MEMFS_TEST=1 make test > $output_file 2> >(tee -a $output_file >&2 | tee $error_file >&2)
  macos-unit-test:
    runs-on: macos-latest
    steps:
    - name: Install Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24.x
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Test
      run: |
        timestamp=$(date +%Y%m%d%H%M%S)
        output_file="macos-unit-test-${timestamp}.log"
        error_file="macos-unit-test-${timestamp}-errors.log"
        make test > $output_file 2> >(tee -a $output_file >&2 | tee $error_file >&2)
  build-tools:
    runs-on: ubuntu-22.04
    steps:
    - name: Install Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24.x
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Build
      run: |
        timestamp=$(date +%Y%m%d%H%M%S)
        output_file="build-tools-${timestamp}.log"
        error_file="build-tools-${timestamp}-errors.log"
        make tools > $output_file 2> >(tee -a $output_file >&2 | tee $error_file >&2)
  build-examples:
    runs-on: ubuntu-22.04
    steps:
    - name: Install Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24.x
    - name: Build
      run: |
        timestamp=$(date +%Y%m%d%H%M%S)
        output_file="build-examples-${timestamp}.log"
        error_file="build-examples-${timestamp}-errors.log"
        git clone https://github.com/lni/dragonboat-example
        cd dragonboat-example
        GOPROXY=direct go get github.com/lni/dragonboat/v4@master
        make > $output_file 2> >(tee -a $output_file >&2 | tee $error_file >&2)
  static-check:
    runs-on: ubuntu-22.04
    steps: 
     - name: Install Go
       uses: actions/setup-go@v3
       with:
         go-version: 1.24.x
     - name: Checkout code
       uses: actions/checkout@v3
     - name: Static check
       run: |
        timestamp=$(date +%Y%m%d%H%M%S)
        install_output_file="static-check-install-${timestamp}.log"
        install_error_file="static-check-install-${timestamp}-errors.log"
        make install-static-check-tools > $install_output_file 2> >(tee -a $install_output_file >&2 | tee $install_error_file >&2)
        run_output_file="static-check-run-${timestamp}.log"
        run_error_file="static-check-run-${timestamp}-errors.log"
        make static-check > $run_output_file 2> >(tee -a $run_output_file >&2 | tee $run_error_file >&2)