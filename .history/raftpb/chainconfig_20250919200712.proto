syntax = "proto3";
package raftpb;

// ChainConfig 链式复制配置参数
message ChainConfig {
  bool enable_chain = 1;                // 是否启用链式复制
  uint64 default_next_shard_id = 2;     // 默认下一个分片ID
  uint64 health_check_interval_ms = 3;  // 健康检查间隔（毫秒）
  int32 max_retry_count = 4;            // 最大重试次数
  uint64 connect_timeout_ms = 5;        // 连接超时（毫秒）
  uint32 max_hop_count = 6;             // 最大跳数
  bool enable_tls = 7;                  // 是否启用TLS加密
  bool auto_connect = 8;                // 是否自动建立连接
  bool chain_aware_compaction = 9;      // 是否启用链式感知日志压缩
}
