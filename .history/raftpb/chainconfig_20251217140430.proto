syntax = "proto3";
package raftpb;

// protoc --gogo_out=. raftpb/chainconfig.proto

// 链角色（核心枚举）
enum ChainRole {
  UNSPECIFIED = 0;
  HEAD = 1;        // 链首领导者（无上游分片，prev_shard_id=0）
  RELAY = 2;       // 中继领导者（上下游分片均存在，prev_shard_id≠0且next_shard_id≠0）
  TAIL = 3;        // 链尾领导者（无下游分片，next_shard_id=0）
  
}

//  链式复制配置参数（分片级）
message ChainConfig {
  // 静态拓扑配置
  uint64 prev_shard_id = 1;             // 上游分片ID（链首为0）
  uint64 next_shard_id = 2;             // 下游分片ID（链尾为0）
  repeated uint64 available_shards = 3; // 故障转移候选分片列表（按优先级排序）
  ChainRole chain_role = 4;             // 分片角色（与拓扑字段强校验）：如 HEAD 角色的 prev_shard_id 必须为0
}

// GlobalChainConfig 链式复制全局配置（新增，跨分片共性规则）- 用于运维策略
message GlobalChainConfig {
  bool enable_chain = 1;                // 是否启用链式复制
  uint32 max_chain_length = 1;          // 全链最大分片数
  uint64 dynamic_adjust_interval_ms = 2; // 动态调整间隔（毫秒）//用于检查全局拓扑，如30秒1次
  // 策略参数（运行时不可修改，仅初始化时配置）
  uint64 sync_interval_ms = 5;          // 状态向量同步/健康检查间隔（毫秒）
  uint64 max_retry_count = 6;           // 连接重试上限（非负整数）
  string service_discovery_addr = 3;    // 服务发现地址
}

// ChainSyncRequest 用于分片间状态同步请求
message ChainSyncRequest {
  uint64 shard_id = 1;          // 目标分片 ID
  uint64 from_index = 2;        // 起始日志索引
  uint64 to_index = 3;          // 结束日志索引
  bytes state_vector = 4;       // 状态向量（用于快速一致性校验）
  uint64 leader_term = 5;       // 发起方领导者任期
  // 新增字段：对应 nodehost.go 中 ChainSyncRequest 的实际使用
  uint64 sync_index = 6;        // 上次同步索引（用于断点续传）
  string leader_addr = 7;       // 发起方领导者地址（用于反向连接）
  uint64 timestamp = 8;         // 请求时间戳（毫秒，防重放攻击）
  uint64 leader_id = 9;          // 发起方领导者ID
}