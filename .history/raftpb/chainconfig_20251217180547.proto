syntax = "proto3";
package raftpb;

// protoc --gogo_out=. raftpb/chainconfig.proto

// 链角色（核心枚举）
enum ChainRole {
  UNSPECIFIED = 0;
  HEAD = 1;        // 链首领导者（无上游分片，prev_shard_id=0）
  RELAY = 2;       // 中继领导者（上下游分片均存在，prev_shard_id≠0且next_shard_id≠0）
  TAIL = 3;        // 链尾领导者（无下游分片，next_shard_id=0）
  
}

//  链式复制配置参数（分片级）
message ChainConfig {
  bool enable_chain = 1;                // 是否启用链式复制
  // 拓扑配置
  uint64 local_shard_id = 2;            // 本地分片 ID
  uint64 prev_shard_id = 3;             // 上游分片ID（链首为0）
  uint64 next_shard_id = 4;             // 下游分片ID（链尾为0）
  uint64 local_leader_id = 5;           // 发起方领导者ID
  string local_leader_addr = 6;         // 发起方领导者地址（用于反向连接）
  uint64 local_leader_term = 7;         // 发起方领导者任期

  repeated uint64 available_shards = 8; // 故障转移候选分片列表（按优先级排序）
  ChainRole chain_role = 9;             // 分片角色（与拓扑字段强校验）：如 HEAD 角色的 prev_shard_id 必须为0
  
  uint64 from_index = 10;               // 起始日志索引
  uint64 to_index = 11;                  // 结束日志索引
  bytes state_vector = 12;               // 状态向量（用于快速一致性校验）
  uint64 sync_index = 13;                // 上次同步索引（用于断点续传）
  uint64 timestamp = 14;                 // 请求时间戳（毫秒，防重放攻击）

  uint64 dynamic_adjust_interval_ms = 15; // 动态调整间隔（毫秒）//用于检查全局拓扑，如30秒1次
  uint64 sync_interval_ms = 16;          // 状态向量同步//健康检查间隔（毫秒）//检查连接状态
  uint64 max_retry_count = 17;           // 连接重试上限（非负整数）
}

