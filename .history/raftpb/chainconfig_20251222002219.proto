syntax = "proto3";
package raftpb;

// protoc --gogo_out=. raftpb/chainconfig.proto

// 链角色（核心枚举）
enum ChainRole {
  UNSPECIFIED = 0;
  HEAD = 1;        // 链首领导者（无上游分片，prev_shard_id=0）
  RELAY = 2;       // 中继领导者（上下游分片均存在，prev_shard_id≠0且next_shard_id≠0）
  TAIL = 3;        // 链尾领导者（无下游分片，next_shard_id=0）
  
}


// 链式复制配置（静态，变化频率低）
message ChainConfig {
  uint64 version = 1;              // 配置版本号
  bool enable_chain = 2;           // 是否启用链式复制
  uint64 prev_shard_id = 3;        // 上游分片ID（0表示无上游）
  uint64 next_shard_id = 4;        // 下游分片ID（0表示无下游）
  ChainRole chain_role = 5;        // 分片角色
  
  uint64 sync_interval_ms = 6;     // 同步间隔（毫秒）
  uint64 max_retry_count = 7;      // 最大重试次数
}

// 链式同步请求（仅包含必要信息）
message ChainSyncRequest {
  uint64 shard_id = 1;             // 分片ID
  uint64 from_index = 2;           // 起始日志索引
  uint64 to_index = 3;             // 结束日志索引
  bytes entries = 4;               // 实际日志条目
  uint64 sync_index = 5;           // 当前同步索引
}