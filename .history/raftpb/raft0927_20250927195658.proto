syntax = "proto3";
package raftpb;

// 日志条目状态枚举（三态版本管理）
enum EntryState {
  ENTRY_STATE_UNSPECIFIED = 0;  // 未指定（默认值）
  ENTRY_STATE_UNCOMMITTED = 1;  // 未提交：已接收但未发起本地Raft组复制
  ENTRY_STATE_COMMITTING = 2;   // 提交中：复制中但未获多数派确认
  ENTRY_STATE_COMMITTED = 3;    // 已提交：本地Raft组多数派已确认（可响应读请求）
}

// 链角色枚举（链式拓扑节点类型）
enum ChainRole {
  CHAIN_ROLE_UNSPECIFIED = 0;  // 未指定
  CHAIN_ROLE_HEAD = 1;         // 链首领导者：无上游，管理全链配置
  CHAIN_ROLE_RELAY = 2;        // 中继领导者：转发日志，聚合下游状态
  CHAIN_ROLE_TAIL = 3;         // 链尾领导者：无下游，反馈尾部状态
}

// 链式复制配置（分片级参数）
message ChainConfig {
  bool enable_chain = 1;                // 是否启用链式复制
  uint64 default_next_shard_id = 2;     // 默认下游分片ID
  uint64 default_prev_shard_id = 3;     // 默认上游分片ID
  uint64 fallback_next_shard_id = 4;    // 故障时备用下游分片ID
  uint64 health_check_interval_ms = 5;  // 健康检查间隔（毫秒）
  uint32 max_retry_count = 6;           // 最大重试次数
  bool enable_dynamic_chain = 7;        // 是否启用动态拓扑调整
  ChainRole chain_role = 8;             // 当前节点链角色
}

// 链式状态上报消息（下游→上游）
message ChainStatus {
  uint64 shard_id = 1;          // 分片ID
  uint64 leader_id = 2;         // 领导者节点ID
  ChainRole role = 3;           // 节点角色
  bool is_healthy = 4;          // 是否健康
  repeated uint64 downstream_shards = 5;  // 下游分片列表（中继节点特有）
}


message GlobalChainConfig {
  uint32 max_chain_length = 1;          // 全链最大分片数
  uint64 dynamic_adjust_interval_ms = 2; // 动态调整间隔（毫秒）
  string service_discovery_addr = 3;    // 服务发现地址
}

// Raft协议消息类型（扩展原有枚举）
enum MessageType {
  // ... 原有消息类型（如Propose, RequestVote等）...
  
  // 链式复制相关消息类型
  LEADER_CHAIN_CONNECT = 30;    // 链连接请求（链首/中继→下游）
  LEADER_CHAIN_ACK = 31;        // 链连接确认（下游→上游）
  LEADER_CHAIN_PING = 32;       // 健康检查Ping（上游→下游）
  LEADER_CHAIN_PONG = 33;       // 健康检查Pong（下游→上游）
  LEADER_CHAIN_DISCONNECT = 34; // 链断开通知
  LEADER_CHAIN_CONFIG = 35;     // 链配置广播（链首→全链）
  LEADER_CHAIN_STATUS = 36;     // 链状态上报（中继/链尾→上游）
  LEADER_CHAIN_REDIRECT = 37;   // 链拓扑重定向（链首→故障上游）
}

// 日志条目（新增状态字段）
message Entry {
  uint64 index = 1;        // 日志索引
  uint64 term = 2;         // 任期号
  bytes cmd = 3;           // 命令数据
  EntryState state = 4;    // 三态版本管理状态（新增字段）
}

// Raft协议消息（扩展链式字段）
message Message {
  MessageType type = 1;    // 消息类型
  uint64 from = 2;         // 发送节点ID
  uint64 to = 3;           // 目标节点ID
  uint64 term = 4;         // 任期号
  uint64 shard_id = 5;     // 分片ID
  
  // ... 原有字段（如entries, index等）...
  
  // 链式复制扩展字段
  ChainConfig chain_config = 20;  // 链式配置（用于LEADER_CHAIN_CONFIG消息）
  ChainStatus chain_status = 21;  // 链式状态（用于LEADER_CHAIN_STATUS消息）
  uint64 new_next_shard = 22;     // 新下游分片ID（用于LEADER_CHAIN_REDIRECT消息）
}
